<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Dashboard</title>
<style>
/* ==========================================================================
   1. THEME: colours, fonts and spacing live here so they are easy to change
   ========================================================================== */
:root {
  --bg: #f4f5f8;
  --surface: #ffffff;
  --surface-2: #f0f2f6;
  --text: #1d2330;
  --muted: #667085;
  --line: #e4e7ec;
  --accent: #3b6cf6;
  --accent-soft: #e9efff;
  --ok: #15803d;
  --warn: #b45309;
  --bad: #b42318;
  --radius: 14px;
  --radius-sm: 9px;
  --rail-w: 92px;
  --rail-w-collapsed: 60px;
  --side-w: 340px;
  --gap: 20px;
  --space-1: 6px;
  --space-2: 10px;
  --space-3: 16px;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-size: 14px;
  --focus: 0 0 0 3px rgba(59, 108, 246, .45);
}

/* ==========================================================================
   2. BASE
   ========================================================================== */
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font: var(--font-size)/1.45 var(--font); color: var(--text); background: var(--bg); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, select, textarea, a { font: inherit; }
button { cursor: pointer; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ==========================================================================
   3. LAYOUT: rail | main | sidebar
   ========================================================================== */
.app { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--side-w); min-height: 100vh; }
.app.rail-collapsed { grid-template-columns: var(--rail-w-collapsed) minmax(0, 1fr) var(--side-w); }

/* 4. LEFT NAVIGATION RAIL */
.rail { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 6px; background: var(--surface); border-right: 1px solid var(--line); }
.rail-nav { display: flex; flex-direction: column; gap: 4px; width: 100%; }
.rail-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border-radius: var(--radius-sm); color: var(--muted); text-decoration: none; font-size: 11.5px; text-align: center; }
.rail-item:hover { background: var(--surface-2); color: var(--text); text-decoration: none; }
.rail-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #f59e0b, #ec4899); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.rail-toggle { margin-top: auto; width: 36px; height: 36px; border: 1px solid var(--line); background: var(--surface); border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.rail-toggle:hover { color: var(--text); }
.app.rail-collapsed .rail-item span:not(.sr-only) { display: none; }
.app.rail-collapsed .rail-toggle svg { transform: rotate(180deg); }

/* 5. MAIN COLUMN */
.main { min-width: 0; padding: 0 28px 40px; }
.topbar { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 4px 16px; padding: 14px 0; font-size: 12.5px; }
.topbar a { color: var(--muted); }
.topbar a:hover { color: var(--accent); }
.page-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 18px; border-bottom: 1px solid var(--line); margin-bottom: var(--gap); }
.page-head h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
.notes { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--space-3); margin-bottom: var(--gap); }
.notes label { display: block; font-weight: 600; margin-bottom: var(--space-2); }
.notes textarea { width: 100%; min-height: 84px; resize: vertical; padding: var(--space-2); border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-2); color: var(--text); }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); align-items: start; }

/* 6. COURSE CARDS */
.course { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
.banner { position: relative; height: 112px; }
.grade-badge { position: absolute; left: 12px; top: 12px; min-width: 44px; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.92); color: var(--text); font-weight: 700; font-size: 13px; text-align: center; }
.banner .menu-btn { position: absolute; right: 10px; top: 10px; }
.course-body { padding: 14px 16px 6px; display: flex; flex-direction: column; gap: 2px; }
.course-title { font-size: 16px; font-weight: 650; margin: 0; }
.course-meta { color: var(--muted); font-size: 12.5px; }
.course-actions { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; border-bottom: 1px solid var(--line); }
.due-section { padding: 10px 16px 16px; }
.due-section h3 { margin: 6px 0 6px; font-size: 13px; color: var(--muted); font-weight: 650; text-transform: uppercase; letter-spacing: .04em; }
.due-list { list-style: none; margin: 0; padding: 0; }
.due-list li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.due-list li:first-child { border-top: 0; }
.due-list .rel { color: var(--muted); white-space: nowrap; }

/* 7. ICON BUTTONS + MENU */
.icon-btn { width: 32px; height: 32px; border-radius: 999px; border: 1px solid transparent; background: transparent; color: var(--muted); display: inline-grid; place-items: center; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn.on-banner { background: rgba(255,255,255,.85); color: var(--text); }
.menu { position: relative; }
.menu-panel { position: absolute; right: 0; top: 36px; z-index: 20; min-width: 150px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); box-shadow: 0 8px 24px rgba(16,24,40,.12); padding: 4px; display: none; }
.menu.open .menu-panel { display: block; }
.menu-panel button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 7px; color: var(--text); }
.menu-panel button:hover, .menu-panel button:focus-visible { background: var(--surface-2); }
.menu-panel button[role="menuitem"]:focus-visible { box-shadow: var(--focus); }

/* 8. RIGHT SIDEBAR: TASKS */
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface); border-left: 1px solid var(--line); padding: 18px 18px 28px; display: flex; flex-direction: column; gap: var(--space-3); }
.side-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
.side-head h2 { margin: 0; font-size: 20px; }
.week-nav { display: flex; align-items: center; gap: 4px; }
.range { font-size: 12.5px; color: var(--muted); min-width: 118px; text-align: center; }
.filter select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); }
.ring-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; }
.ring { position: relative; width: 150px; height: 150px; }
.ring svg { width: 150px; height: 150px; transform: rotate(-90deg); }
.ring .track { fill: none; stroke: var(--surface-2); stroke-width: 12; }
.ring .bar { fill: none; stroke: var(--accent); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-center b { font-size: 30px; letter-spacing: -.02em; }
.ring-center .frac { font-weight: 600; margin-top: 2px; }
.ring-center .done-label { color: var(--muted); font-size: 12.5px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 4px; position: relative; border: 0; background: none; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tab:hover { color: var(--text); }
.tab .icon { width: 20px; height: 20px; }
.tab[title]:hover::after { content: attr(title); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; font-size: 11px; padding: 3px 7px; border-radius: 6px; white-space: nowrap; margin-bottom: 4px; }
.urgency { font-size: 12.5px; font-weight: 650; color: var(--muted); margin: 14px 0 6px; text-transform: lowercase; }
.task { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 8px; background: var(--surface); }
.task .kind { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.task.quiz .kind { background: #fdf0e6; color: var(--warn); }
.task .code { font-size: 11.5px; color: var(--muted); }
.task .name { font-weight: 600; display: block; color: var(--text); }
.task .when { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.task.done .name { text-decoration: line-through; color: var(--muted); }
.check { width: 28px; height: 28px; border-radius: 50%; border: 1.6px solid #c3c9d4; background: var(--surface); display: grid; place-items: center; color: transparent; align-self: start; }
.check[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.check:hover { border-color: var(--ok); }
.more-btn { width: 100%; margin-top: 4px; padding: 8px; border: 0; background: none; color: var(--accent); font-weight: 600; border-radius: var(--radius-sm); }
.more-btn:hover { background: var(--accent-soft); }
.empty { color: var(--muted); padding: 10px 2px; font-size: 13px; }
.feedback h3 { font-size: 15px; margin: 0 0 6px; }
.grades-btn { display: block; width: 100%; text-align: center; padding: 12px; border-radius: var(--radius-sm); background: var(--accent); color: #fff; font-weight: 650; border: 0; text-decoration: none; margin-top: auto; }
.grades-btn:hover { background: #2f5ae0; text-decoration: none; color: #fff; }
.announce { padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 8px; }
.announce .code { font-size: 11.5px; color: var(--muted); }

/* ==========================================================================
   9. RESPONSIVE
   ========================================================================== */
@media (max-width: 1280px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  :root { --gap: 14px; }
  .app, .app.rail-collapsed { grid-template-columns: 1fr; }
  .rail { position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; flex-direction: row; justify-content: space-around; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); border-right: 0; border-top: 1px solid var(--line); z-index: 30; }
  .rail-nav { flex-direction: row; justify-content: space-around; width: auto; }
  .rail-item { padding: 6px 4px; }
  .rail-item span:not(.sr-only) { font-size: 10.5px; }
  .avatar { width: 32px; height: 32px; font-size: 12px; }
  .rail-toggle { display: none; }
  .main { padding: 0 16px 92px; }
  .cards { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; border-left: 0; border-top: 1px solid var(--line); }
  .page-head h1 { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ===================== 4. LEFT NAVIGATION RAIL ===================== -->
  <nav class="rail" aria-label="Main">
    <div class="rail-nav" id="railNav"></div>
    <button class="rail-toggle" id="railToggle" type="button" aria-expanded="true" aria-controls="railNav" aria-label="Collapse navigation">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
  </nav>

  <!-- ===================== MAIN CONTENT COLUMN ===================== -->
  <div class="page-wrap" style="min-width:0">
    <div class="main" id="main">
      <!-- 5. TOP BAR -->
      <nav class="topbar" aria-label="Site links">
        <a href="#">Home</a>
        <a href="#">Portal</a>
        <a href="#">Colleges &amp; Schools</a>
        <a href="#">Map &amp; Locations</a>
        <a href="#">Contact Us</a>
      </nav>

      <!-- 1. PAGE HEADER -->
      <header class="page-head">
        <h1 id="pageTitle">Dashboard</h1>
        <div class="menu" id="pageMenu">
          <button class="icon-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Dashboard options">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>
          </button>
          <div class="menu-panel" role="menu" aria-label="Dashboard options">
            <button type="button" role="menuitem">Customize layout</button>
            <button type="button" role="menuitem">Reset notes</button>
          </div>
        </div>
      </header>

      <!-- 2. NOTES BOX -->
      <section class="notes" aria-labelledby="notesLabel">
        <label id="notesLabel" for="notes">Notes</label>
        <textarea id="notes" placeholder="Enter notes here"></textarea>
      </section>

      <!-- 3. COURSE CARDS -->
      <section aria-label="My courses">
        <div class="cards" id="cards"></div>
      </section>
    </div>
  </div>

  <!-- ===================== 6. RIGHT SIDEBAR: TASKS ===================== -->
  <aside class="side" aria-labelledby="tasksTitle">
    <div class="side-head">
      <h2 id="tasksTitle">Tasks</h2>
      <div style="display:flex;align-items:center;gap:6px">
        <button class="icon-btn" type="button" aria-label="Task settings">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <div class="week-nav">
          <button class="icon-btn" type="button" id="prevWeek" aria-label="Previous week">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <span class="range" id="range" aria-live="polite"></span>
          <button class="icon-btn" type="button" id="nextWeek" aria-label="Next week">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="filter">
      <label class="sr-only" for="courseFilter">Filter tasks by course</label>
      <select id="courseFilter"></select>
    </div>

    <div class="ring-wrap" aria-live="polite">
      <div class="ring">
        <svg viewBox="0 0 150 150" aria-hidden="true">
          <circle class="track" cx="75" cy="75" r="62"/>
          <circle class="bar" id="ringBar" cx="75" cy="75" r="62" stroke-dasharray="389.56" stroke-dashoffset="389.56"/>
        </svg>
        <div class="ring-center">
          <b id="pct">0%</b>
          <span class="frac" id="frac">0/0</span>
          <span class="done-label">Complete</span>
        </div>
      </div>
    </div>

    <div class="tabs" role="tablist" aria-label="Task categories" id="tabs">
      <button class="tab" role="tab" id="tab-announcements" title="Announcements" aria-controls="panel" aria-selected="false" tabindex="-1" data-tab="announcements">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg><span class="sr-only">Announcements</span>
      </button>
      <button class="tab" role="tab" id="tab-assignments" title="Assignments" aria-controls="panel" aria-selected="true" tabindex="0" data-tab="assignments">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h8l4 4v14H7z"/><path d="M9 12h7M9 16h5"/></svg><span class="sr-only">Assignments</span>
      </button>
      <button class="tab" role="tab" id="tab-submitted" title="Submitted" aria-controls="panel" aria-selected="false" tabindex="-1" data-tab="submitted">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg><span class="sr-only">Submitted</span>
      </button>
    </div>

    <div role="tabpanel" id="panel" aria-labelledby="tab-assignments"></div>

    <section class="feedback" aria-labelledby="feedbackTitle">
      <h3 id="feedbackTitle">Recent Feedback</h3>
      <p class="empty">Nothing for now</p>
    </section>

    <a class="grades-btn" href="#grades">View Grades</a>
  </aside>
</div>

  history:   '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  help:      '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14"/><circle cx="12" cy="17.5" r=".6" fill="currentColor"/>',
  access:    '<circle cx="12" cy="5" r="2"/><path d="M5 8h14M12 8v5l-3 6M12 13l3 6"/>',
  announce:  '<path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M16 9a4 4 0 0 1 0 6"/>',
  rocket:    '<path d="M5 15c-1.5 1-2 4-2 4s3-.5 4-2"/><path d="M14 4c3 0 5 2 5 5-1.5 4-5 7-7 7-1 0-2-.5-2.5-1.5L8.5 13.5C8 12.5 7 10.5 7 10c0-2 3-6 7-6z"/><circle cx="14" cy="10" r="1.4"/>',
  notepad:   '<path d="M7 3h10a2 2 0 0 1 2 2v15H5V5a2 2 0 0 1 2-2z"/><path d="M9 3v2M15 3v2M8.5 10h7M8.5 14h7M8.5 18h4"/>',
  check:     '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  chevLeft:  '<path d="M15 6l-6 6 6 6"/>',
  chevRight: '<path d="M9 6l6 6-6 6"/>',
};
const svg = (name) => `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${ICON[name]}</svg>`;

/* ==========================================================================
   C. HELPERS: dates, relative labels, course lookup
   ========================================================================== */
const DAY = 864e5;
const courseById = (id) => DATA.courses.find((c) => c.id === id);
const startOfDay = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const dueDate = (t) => { const d = new Date(); d.setDate(d.getDate() + t.offsetDays); d.setHours(t.hour, t.minute, 0, 0); return d; };
const fmtDue = (d) => `Due ${d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} at ${d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}`;
const fmtShort = (d) => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

/** "in 3d" under a week, then "in 1w", "in 2w". Based on the real due date, not a stored label. */
function relative(d, now = new Date()) {
  const days = daysUntil(d, now);
  if (days === 0) return 'today';
  if (days < 7) return `in ${days}d`;
  return `in ${Math.round(days / 7)}w`;
}
/** Calendar days until the due date. Used by both the card labels and the "due N days" groups, so they always agree. */
const daysUntil = (d, now = new Date()) => Math.round((startOfDay(d) - startOfDay(now)) / DAY);

/* Week state: the window starts today and the arrows move it by 7 days. */
const state = { weekOffset: 0, course: 'all', tab: 'assignments', expanded: false };
function weekStart() {
  const d = startOfDay(new Date());
  d.setDate(d.getDate() + state.weekOffset * 7);
  return d;
}
function weekRange() {
  const s = weekStart(), e = new Date(s); e.setDate(e.getDate() + 6);
  return { start: s, end: e };
}
const inWeek = (d) => { const { start, end } = weekRange(); return d >= start && d < new Date(end.getTime() + DAY); };

/* ==========================================================================
   D. COURSE CARDS
   ========================================================================== */
function renderCards() {
  const wrap = document.getElementById('cards');
  wrap.replaceChildren(...DATA.courses.map((c) => {
    const upcoming = DATA.tasks.filter((t) => t.course === c.id && !t.submitted).map((t) => ({ t, d: dueDate(t) })).sort((a, b) => a.d - b.d);
    const card = document.createElement('article');
    card.className = 'course';
    card.setAttribute('aria-labelledby', `c-${c.id}`);
    card.innerHTML = `
      <div class="banner" style="background:${c.banner}">
        <span class="grade-badge" aria-label="Current grade">${c.grade == null ? '--%' : c.grade + '%'}</span>
        <div class="menu" data-menu>
          <button class="icon-btn on-banner menu-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Options for ${c.title}">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>
          </button>
          <div class="menu-panel" role="menu" aria-label="Options for ${c.title}">
            <button type="button" role="menuitem">Hide course</button>
            <button type="button" role="menuitem">Course settings</button>
          </div>
        </div>
      </div>
      <div class="course-body">
        <h2 class="course-title" id="c-${c.id}"><a href="#course-${c.id}">${c.title}</a></h2>
        <div class="course-meta">${c.code}</div>
        <div class="course-meta">${c.term}</div>
      </div>
      <div class="course-actions">
        <span class="course-meta">${c.announcements} new announcement${c.announcements === 1 ? '' : 's'}</span>
        <button class="icon-btn" type="button" aria-label="Announcements for ${c.title}" title="Announcements">${svg('announce')}</button>
      </div>
      <div class="due-section">
        <h3>Due</h3>
        ${upcoming.length ? `<ul class="due-list">${upcoming.map(({ t, d }) => `
          <li><span>${t.title}</span><span class="rel" title="${fmtDue(d)}">${relative(d)}</span></li>`).join('')}</ul>`
          : '<p class="empty">Nothing due. Nice.</p>'}
      </div>`;
    return card;
  }));
  // menus: one open at a time, Escape closes, clicking outside closes
  wrap.querySelectorAll('[data-menu]').forEach(setupMenu);
}

/** Generic three-dot menu: button toggles the panel, Escape or outside click closes it. */
function setupMenu(root) {
  const btn = root.querySelector('button[aria-haspopup]');
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    closeMenus(root);
    const open = !root.classList.contains('open');
    root.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', String(open));
    if (open) root.querySelector('[role="menuitem"]').focus();
  });
  root.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeMenus(); btn.focus(); }
  });
}
function closeMenus(except) {
  document.querySelectorAll('.menu.open').forEach((m) => {
    if (m === except) return;
    m.classList.remove('open');
    m.querySelector('button[aria-haspopup]').setAttribute('aria-expanded', 'false');
  });
}
document.addEventListener('click', () => closeMenus());

/* ==========================================================================
   E. TASKS SIDEBAR: filter, ring, tabs, grouped list, week navigation
   ========================================================================== */
function renderFilter() {
  const sel = document.getElementById('courseFilter');
  sel.innerHTML = '<option value="all">All Courses</option>' + DATA.courses.map((c) => `<option value="${c.id}">${c.title}</option>`).join('');
  sel.value = state.course;
}

/** Tasks in the selected week and course, sorted by due date. */
function visibleTasks() {
  return DATA.tasks
    .map((t) => ({ t, d: dueDate(t) }))
    .filter(({ t, d }) => inWeek(d) && (state.course === 'all' || t.course === state.course))
    .sort((a, b) => a.d - b.d);
}

function renderRing() {
  const list = visibleTasks();
  const done = list.filter(({ t }) => t.submitted).length, total = list.length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  const C = 2 * Math.PI * 62;
  document.getElementById('ringBar').style.strokeDashoffset = String(C * (1 - pct / 100));
  document.getElementById('pct').textContent = pct + '%';
  document.getElementById('frac').textContent = `${done}/${total}`;
}

function renderRange() {
  const { start, end } = weekRange();
  document.getElementById('range').textContent = `${fmtShort(start)} to ${fmtShort(end)}`;
}

function taskCard({ t, d }) {
  const li = document.createElement('li');
  li.className = `task ${t.kind}${t.submitted ? ' done' : ''}`;
  li.style.listStyle = 'none';
  const c = courseById(t.course);
  li.innerHTML = `
    <div class="kind">${svg(t.kind === 'quiz' ? 'rocket' : 'notepad')}</div>
    <div>
      <div class="code">${c.code}</div>
      <a class="name" href="#task-${t.id}">${t.title}</a>
      <div class="when">${fmtDue(d).replace(/^Due /, 'Due ')} | ${t.points} points</div>
    </div>
    <button class="check" type="button" aria-pressed="${t.submitted}" aria-label="${t.submitted ? 'Mark not submitted' : 'Mark submitted'}: ${t.title}" data-id="${t.id}">${svg('check')}</button>`;
  return li;
}

function renderPanel() {
  const panel = document.getElementById('panel');
  const tabEl = document.getElementById(`tab-${state.tab}`);
  panel.setAttribute('aria-labelledby', tabEl.id);
  if (state.tab === 'announcements') {
    const items = DATA.announcements.filter((a) => state.course === 'all' || a.course === state.course);
    panel.replaceChildren(...(items.length ? items.map((a) => {
      const div = document.createElement('div'); div.className = 'announce';
      div.innerHTML = `<div class="code">${courseById(a.course).title} · posted ${Math.abs(a.posted)}d ago</div><strong>${a.title}</strong><div>${a.body}</div>`;
      return div;
    }) : [Object.assign(document.createElement('p'), { className: 'empty', textContent: 'No announcements for this week.' })]));
    return;
  }

  const list = visibleTasks().filter(({ t }) => state.tab === 'submitted' ? t.submitted : true);
  if (!list.length) {
    panel.innerHTML = `<p class="empty">${state.tab === 'submitted' ? 'Nothing submitted this week.' : 'No tasks this week.'}</p>`;
    return;
  }
  const limit = 4, shown = state.expanded ? list : list.slice(0, limit);
  const groups = new Map();
  shown.forEach((item) => {
    const n = daysUntil(item.d), key = n === 0 ? 'due today' : `due ${n} day${n === 1 ? '' : 's'}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(item);
  });
  const frag = document.createDocumentFragment();
  groups.forEach((items, label) => {
    const h = document.createElement('h3'); h.className = 'urgency'; h.textContent = label; frag.append(h);
    const ul = document.createElement('ul'); ul.style.padding = '0'; ul.style.margin = '0';
    items.forEach((item) => ul.append(taskCard(item)));
    frag.append(ul);
  });
  panel.replaceChildren(frag);
  if (list.length > limit) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'more-btn'; b.id = 'moreBtn';
    b.textContent = state.expanded ? 'Show less' : `View ${list.length - limit} more`;
    panel.append(b);
  }
}

function renderAll() {
  renderFilter(); renderRange(); renderRing(); renderPanel();
}

/* ==========================================================================
   F. EVENTS
   ========================================================================== */
// Task completion: toggles state, then refreshes ring and list.
document.getElementById('panel').addEventListener('click', (e) => {
  const check = e.target.closest('.check');
  if (check) {
    const t = DATA.tasks.find((x) => x.id === check.dataset.id);
    t.submitted = !t.submitted;
    renderRing(); renderPanel();
    // return focus to the same control, which may have been rebuilt
    const again = document.querySelector(`.check[data-id="${t.id}"]`);
    if (again) again.focus();
    return;
  }
  if (e.target.id === 'moreBtn') { state.expanded = !state.expanded; renderPanel(); document.getElementById('moreBtn')?.focus(); }
});

// Week arrows
document.getElementById('prevWeek').addEventListener('click', () => { state.weekOffset--; state.expanded = false; renderAll(); });
document.getElementById('nextWeek').addEventListener('click', () => { state.weekOffset++; state.expanded = false; renderAll(); });

// Course filter
document.getElementById('courseFilter').addEventListener('change', (e) => { state.course = e.target.value; state.expanded = false; renderAll(); });

// Tabs: click, arrow keys, Home and End (roving tabindex)
const tabList = document.getElementById('tabs');
const tabs = [...tabList.querySelectorAll('[role="tab"]')];
function selectTab(tab, focus = true) {
  state.tab = tab.dataset.tab; state.expanded = false;
  tabs.forEach((x) => { const on = x === tab; x.setAttribute('aria-selected', String(on)); x.tabIndex = on ? 0 : -1; });
  if (focus) tab.focus();
  renderPanel();
}
tabs.forEach((tab) => tab.addEventListener('click', () => selectTab(tab, false)));
tabList.addEventListener('keydown', (e) => {
  const i = tabs.indexOf(document.activeElement);
  if (i < 0) return;
  const next = { ArrowRight: (i + 1) % tabs.length, ArrowLeft: (i - 1 + tabs.length) % tabs.length, Home: 0, End: tabs.length - 1 }[e.key];
  if (next === undefined) return;
  e.preventDefault(); selectTab(tabs[next]);
});

// Left rail collapse
const app = document.getElementById('app'), railToggle = document.getElementById('railToggle');
railToggle.addEventListener('click', () => {
  const collapsed = app.classList.toggle('rail-collapsed');
  railToggle.setAttribute('aria-expanded', String(!collapsed));
  railToggle.setAttribute('aria-label', collapsed ? 'Expand navigation' : 'Collapse navigation');
});

// Page options menu
setupMenu(document.getElementById('pageMenu'));

/* ==========================================================================
   G. NOTES: saved to localStorage so they survive a reload
   ========================================================================== */
const NOTES_KEY = 'my-dashboard-notes';
const notesEl = document.getElementById('notes');
try { notesEl.value = localStorage.getItem(NOTES_KEY) || ''; } catch (e) { /* storage blocked: notes just won't persist */ }
notesEl.addEventListener('input', () => { try { localStorage.setItem(NOTES_KEY, notesEl.value); } catch (e) { /* ignore */ } });

/* ==========================================================================
   H. NAVIGATION RAIL: built from a single list
   ========================================================================== */
const RAIL = [
  { id: 'dashboard', label: 'Dashboard', icon: 'dashboard', current: true },
  { id: 'courses', label: 'Courses', icon: 'courses' },
  { id: 'groups', label: 'Groups', icon: 'groups' },
  { id: 'calendar', label: 'Calendar', icon: 'calendar' },
  { id: 'inbox', label: 'Inbox', icon: 'inbox' },
  { id: 'history', label: 'History', icon: 'history' },
  { id: 'help', label: 'Help', icon: 'help' },
  { id: 'access', label: 'Accessibility', icon: 'access' },
];
document.getElementById('railNav').innerHTML =
  `<a class="rail-item" href="#account" aria-label="Account: ${DATA.student.name}"><span class="avatar" aria-hidden="true">${DATA.student.initials}</span><span>Account</span></a>` +
  RAIL.map((i) => `<a class="rail-item" href="#${i.id}"${i.current ? ' aria-current="page"' : ''}>${svg(i.icon)}<span>${i.label}</span></a>`).join('');

/* ==========================================================================
   I. START
   ========================================================================== */
renderCards();
renderAll();
// Refresh the relative labels and the "due" groups once an hour, without a reload.
setInterval(() => { renderCards(); renderPanel(); }, 3600e3);
</script>
</body>
</html>
